# Netlify – Web-Beta (#21). Baut bei jedem Push auf main und veröffentlicht dist/.
# Die Schlüssel des Produktionsprojekts (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY) und die
# Kontaktangaben (VITE_CONTACT_*) stehen in Netlify unter Site configuration → Environment variables.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Sicherheits-Header für alle Seiten.
# CSP: Skripte nur von hier; Daten, Echtzeit und Fotos nur von Supabase; Icon/Manifest erzeugt die App
# selbst (data:/blob:); Inline-Styles nutzt die Oberfläche für Farben.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Startseite und Service Worker immer frisch laden, gebaute Dateien (mit Hash im Namen) lange cachen
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
